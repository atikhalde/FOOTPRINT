# ============================================================
# FPFSSL8.2 scanner / backtest configuration
# Live Indian market (NSE) via yfinance — 1:1 with the Pine indicator.
# Default: DAILY timeframe, full NSE universe, raw (unadjusted) prices.
# ============================================================

# NSE symbol universe (Yahoo Finance tickers; .NS = NSE, .BO = BSE).
# `full_nse` expands to the COMPLETE NSE equity list (~2,000+ symbols,
# fetched once and cached in data/nse_universe.csv; see fpfssl/universe.py).
# Mix explicit names in freely — duplicates are removed:
symbols:
  - full_nse
  # - TATAMOTORS.NS     # add specific names next to full_nse if needed

data:
  source: yahoo          # yahoo | csv | synthetic
  # Daily TF = the same bars the TradingView indicator runs on. The engine is
  # timeframe-agnostic exactly like the Pine script: 1d and 15m run the same
  # bar-by-bar state machines.
  interval: 1d           # yfinance TF: 1m,2m,5m,15m,30m,60m,90m,1h,1d,1wk,1mo
  period: null           # yahoo lookback override (null = auto: max for daily, 60d for 15m)
  prepost: false         # NSE has no pre/post session in this feed — keep false
  # 100% parity with the indicator: the Pine script runs on the EXCHANGE's
  # raw unadjusted NSE prices. Adjusted OHLC would shift every OB/eSSL level
  # the chart shows. Keep false.
  auto_adjust: false
  # Full-universe fetching: yfinance makes one request per ticker, so a
  # full-NSE pass is thousands of requests. The scanner fetches every symbol
  # of a pass in one threaded batch, paced in groups.
  batch: true
  batch_size: 100
  batch_threads: 8
  batch_delay_sec: 0.5
  csv_dir: data          # used when source=csv (date,open,high,low,close,volume; date may include HH:MM)
  # The scanner runs the engine over ALL bars the feed serves (Yahoo: full
  # daily history from listing): the footprint-OB state machine is
  # path-dependent, exactly like the Pine indicator's — a zone born long ago
  # is still a live TAP reference today. history_bars is the *minimum* the
  # scanner wants; max_bars is the only cap (0 = keep everything).
  history_bars: 600
  max_bars: 0
  start: null            # optional window start, e.g. "2022-01-01" (daily) — intraday capped by Yahoo window
  end: null
  # full_nse universe resolution
  universe_cache_file: data/nse_universe.csv
  universe_max_age_days: 7
  tick_overrides: {}     # NSE/BSE resolve to 0.05 automatically; override only if needed, e.g. {RELIANCE.NS: 0.05}
  # Share counts for the scanner's market-cap size filter (see fpfssl/fundamentals.py).
  # Market cap = cached share count x last close, recomputed every pass, so only
  # symbols the cache cannot answer cost a request (first full-NSE pass only).
  fundamentals_cache_file: data/nse_fundamentals.csv
  fundamentals_max_age_days: 30    # refetch a share count older than this

scanner:
  poll_minutes: 15       # daily polling cadence (intraday TFs can poll faster)
  state_file: state/scanner_state.json
  provisional_alerts: true   # alert on the still-forming bar too (marked LIVE), then again when confirmed
                             # (the close-confirmed follow-up of the SAME bar is exempt from the
                             # cooldown below — on a daily bar it always lands inside the window, and
                             # it is the state the indicator shows at the close, e.g. RECLAIMED ✅)
  alert_cooldown_minutes: 60 # per symbol+event-type spam guard (across different bars).
                             # It never suppresses a NEWER bar: the recent_bars window is
                             # walked newest-first and each cooldown entry remembers the bar
                             # that opened it, so today's touch of a level is not swallowed
                             # by an older bar's alert. Repeats of the SAME bar still
                             # collapse into one message.
  min_bars: 600          # skip symbols with less history (ATR/MA/pivot/SSL/pool warmup)
  stop_after_close_minutes: 15   # keep polling this long past 15:30 IST for the closing bar
  preopen_wait_minutes: 180      # started up to this far before the open -> wait for the
                                 # bell (started earlier: one pass, then exit)
  # Hard wall-clock budget for `scan` (no --once): after this many minutes the
  # poller saves its dedup state and exits cleanly even mid-session, so a long CI
  # job always ends by itself instead of being killed mid-pass. `scanner.reschedule_in_ci`
  # then hands the rest of the session to a fresh run (the dedup state is saved,
  # so a resumed run never re-announces an alert). 0 = unlimited (the market
  # clock alone decides). 280 keeps a job under GitHub's 6h per-job limit while
  # still covering most of the 09:15-15:30 IST session.
  max_runtime_minutes: 280       # 0 = no limit; CI may raise it, never past its job timeout
  max_stale_days: 4      # skip symbols whose last bar is older than this many TRADING days (weekends OK)
  max_lag_minutes: 90    # intraday: skip when market is open but the feed lags more than this
  market_timezone: Asia/Kolkata  # live NSE clock (IST)
  market_open: "09:15"   # NSE equity open (IST)
  market_close: "15:30"  # NSE equity close (IST)
  recent_bars: 3         # only the last N bars can raise new alerts (daily + intraday)
  # ---- size filters: only scan stocks big enough to be worth an alert ----
  # Strictly-greater-than, applied per symbol right after its bars are loaded and
  # BEFORE the engine runs (a filtered stock therefore costs no engine time):
  #   RELIANCE.NS  price 1,432.00  mcap 950,000 Cr -> scanned
  #   some penny co   price 63.50  mcap   120 Cr    -> skipped (both filters)
  # Share count (x last close) = market cap, cached in data/nse_fundamentals.csv;
  # set either knob to 0 to switch that filter off.
  min_market_cap_cr: 1000      # ₹ crore — keep only stocks worth more than 1,000 Cr
  min_price: 100               # ₹ — keep only stocks trading above ₹100
  keep_unknown_market_cap: true  # no share count available -> scan it anyway
                                 # (a metadata outage must never swallow alerts)
  market_cap_cr_overrides: {}  # pin a symbol's ₹ crore when you know better, e.g.
                               # {TATASTEEL.NS: 95000} — also the offline escape hatch
  # ---- how one run covers the session ----
  # false (default): `scan` (without --once) polls the market until the close
  # (+ `stop_after_close_minutes`) or until `max_runtime_minutes` cuts it. This
  # is what makes a session work: GitHub's `schedule` trigger delivered 2 of ~80
  # ticks on a session day here and both landed after 15:30 IST, so "one tick ->
  # one pass" spends the whole session scanning nothing.
  # true: one complete pass per run, save the dedup state, exit. Use it when an
  # external pinger drives `repository_dispatch`, or with the self re-arm below
  # as the pinger (every finished pass immediately queues the next one).
  exit_after_pass: false
  # Consecutive passes that produced NO DATA (yahoo stalling / rate-limited)
  # before the run gives up. A failed pass is a reason to retry, not to end the
  # session worker: killing it on one feed hiccup used to mean "no alerts for the
  # rest of the day", because the next tick is GitHub's, i.e. hours away.
  max_pass_failures: 6
  # A pass cut by `max_pass_minutes` resumes where it stopped (the offset is
  # persisted in the state file) instead of rescanning the same head of an
  # alphabetically sorted universe - otherwise the tail of full_nse can never
  # alert, since the ceiling cuts the pass at the same place every run.
  rotate_universe: true
  # Machine-readable end-of-run report (universe scanned / filtered / no-data
  # counts, alerts sent, dedup+cooldown suppressions, Telegram delivery stats,
  # why the run stopped). The Scanner workflow appends it to the job summary so
  # "no alerts" is explainable from the run page. "" = off.
  report_file: state/scan_report.json
  # ---- self re-arm: cover the session even when Actions cron does not ----
  # A run that stops while the market day is still live dispatches exactly ONE
  # successor (workflow_dispatch via GITHUB_TOKEN), so the chain - not GitHub's
  # best-effort scheduler - keeps the scanner running to the close. Inert outside
  # Actions, never armed by a dry run or a user cancel, and capped per market day.
  # Needs `permissions: actions: write` in the workflow (and Settings -> Actions
  # -> General -> Workflow permissions: "Read and write" if the org caps it).
  reschedule_in_ci: true
  reschedule_max_runs_per_day: 40
  # Ceiling for ONE pass (fetch + engine loop). A stalled yahoo download is
  # abandoned in a daemon thread at this point instead of hanging the job
  # forever — the hang that made a completed scan look like a stuck scanner.
  # Set it above a normal full-NSE pass (a few tens of minutes), below the CI
  # job's own backstop; 0 = no ceiling.
  max_pass_minutes: 90
  # TAP signal filters (apply to essl_ob_tap composite + footprint_tap ONLY —
  # the 💧 essl_tap level-touch alert is exempt: it fires on every touch of any
  # active eSSL level, fresh or old, footprint TAP or not):
  tap_first_only: true   # only TAP 1/N alerts; TAP 2/3/4 stay silent
  fresh_ob_only: true    # only alert when the tapped OB itself is young
  fresh_ob_max_age_bars: 50  # OB freshness window in bars of data.interval
                         # (daily: 50 ≈ 2.5 months; intraday needs more, e.g. 500 for 15m)
  # Which events produce Telegram messages. essl_ob_tap is the composite:
  #   price TAPPED an eSSL level on a bar where a footprint-source TAP also
  #   fired = "price at eSSL level with ALL the remaining rules matched".
  # eSSL taps are touches of a level that is STILL ACTIVE when the bar ends —
  # exactly the levels the indicator draws. A bar that closes back above after
  # tapping (sweep + reclaim) is a valid tap; a bar that closes BELOW the level
  # retires it in the indicator (first full penetration is terminal) and is
  # reported — if at all — as essl_break, never as a touch.
  alert_events:
    - essl_ob_tap        # 🚨 composite — primary signal (TAP #1 + fresh OB only)
    - essl_tap           # 💧 price TOUCHED an eSSL level — every active level, fresh or old,
                         #    with or without a footprint TAP that bar; NOT gated by the
                         #    TAP filters above, so a filtered composite still alerts its touch
    - footprint_tap      # source-compatible TAP #1 on a fresh FP-OB
    # muted — TAP #1 / fresh-OB focus (add back to the list to re-enable):
    # - essl_sweep       # eSSL penetration + close reclaim (liquidity grab)
    # - essl_break       # ⚠️ eSSL closed below — the level is retired (this is
    #                    #    what a "NOT reclaimed" tap bar really is)
    # - defence          # source defence confirmed after a TAP
    # - zone_invalid     # OB invalidated (stop) or touch limit exceeded
    # - essl_created     # new eSSL reference published (fresh major low)
    # optional (off by default — add to the list to enable):
    # - footprint_created# every newly confirmed FP-OB (TAP armed at its reference)

telegram:
  enabled: true
  # ---- delivery limits (Telegram allows ~1 message/second PER CHAT) ----
  # A full-NSE pass raises hundreds of taps at once. Sent back-to-back, Telegram
  # answers 429 Too Many Requests and - before these limits existed - every
  # rejected message was lost: the run went green and the chat stayed silent.
  # The notifier now paces itself, honours `retry_after`, retries 5xx and falls
  # back to plain text when the HTML entities are rejected, so an alert is
  # delayed rather than dropped. Set min_interval_sec to 0 only when sending to a
  # channel and living with the occasional 429.
  min_interval_sec: 1.0
  max_retries: 4           # attempts per message (429 / 5xx / connection errors)
  retry_backoff_sec: 2.0   # base of the exponential backoff between attempts
  max_wait_sec: 90.0       # total waiting budget for ONE message
  mute_after_failure_sec: 60 # after a message runs out of retries, pause sends this
                             # long (the pass must not burn hours waiting on Telegram;
                             # deferred alerts are retried on the next pass)
  # MUST be false for the live scanner to actually send. `true` only prints
  # the messages to the log (use `scan --dry-run` for that instead; CI passes
  # --no-dry-run on real runs so this flag can never silently swallow alerts).
  dry_run: false
  token: null            # or env var TELEGRAM_BOT_TOKEN (recommended)
  chat_id: null          # or env var TELEGRAM_CHAT_ID
  api_base: https://api.telegram.org

backtest:
  strategy: essl_ob_tap  # essl_ob_tap (default) | ob_tap | essl_sweep
  entry: next_open       # next_open (signal at bar close -> enter next open) | bar_close
  rr: 2.0                # take-profit in R multiples (0 disables target)
  max_bars: 30           # time exit
  risk_per_trade: 0.01   # for the compounded equity curve
  initial_capital: 100000
  sweep_stop_atr: 0.5    # essl_sweep strategy: stop = level - 0.5*ATR
  entry_tap: 1           # ob_tap strategy: enter on TAP n (0 = any tap)
  one_position_per_symbol: true

# Engine parameters: defaults are the Pine script's own defaults.
# Override only what you have tested; every key mirrors a Pine input:
#   atr_length, volume_length, support_length, strong_rvol, evidence_window,
#   minimum_evidence_bars, repeated_bar_rvol, repeated_mean_rvol,
#   max_evidence_body, max_evidence_range, max_downside_progress,
#   evidence_close_location, minimum_lower_wick, support_distance_atr,
#   max_base_width_atr, confirmation_structure, confirmation_deadline,
#   departure_clearance, displacement_grace, minimum_displacement_range,
#   minimum_displacement_body, displacement_close_location, break_clearance,
#   break_grace, max_pending_setups, origin_search, origin_padding,
#   minimum_link_ticks, minimum_width_ticks, max_ob_width_atr,
#   invalidation_mode, invalidation_atr, invalidation_ticks,
#   contact_departure_atr, max_contacts, max_zones, duplicate_overlap,
#   precision_zone_method, source_atr_length, source_volume_length,
#   source_entry_mode, source_front_run_mode, source_front_run_atr,
#   source_front_run_ticks, source_max_zone_buffer, source_entry_offset_ticks,
#   source_stop_atr, source_approach_atr, source_min_age, source_max_touches,
#   source_raise_after_first_tap, source_repeat_tap_atr,
#   source_require_departure, source_confirm_bars, source_confirm_rvol,
#   source_confirm_clv, source_confirm_bos_length, source_require_sweep,
#   source_sweep_length, ssl_enabled, ssl_internal_depth, ssl_external_depth,
#   ssl_show_equal, ssl_equal_atr, ssl_penetration_ticks, ssl_reclaim_ticks,
#   ssl_max_age, ssl_record_cap, ssl_context_bars, ssl_context_distance,
#   fresh_show_confirmed, fresh_show_developing,
#   fresh_low_source, fresh_record_cap,
#   essl_tap_buffer_ticks, essl_tap_max_age  (group-8 alert extension only)
engine: {}
