name: Scanner

# ---------------------------------------------------------------------------
# Live NSE scanner (09:15-15:30 IST = 03:45-10:00 UTC, Mon-Fri).
#
# Default setup (config.yaml): DAILY timeframe (1d), the FULL NSE equity
# universe (symbols: [full_nse], fetched via yfinance .NS tickers, list cached
# in data/nse_universe.csv) and raw exchange prices so signals 1:1 match the
# TradingView indicator. Each internal poll fetches the whole universe in one
# paced batch, then runs the engine over every symbol.
#
# Reliability design: GitHub's `schedule` trigger is best-effort — ticks are
# delayed by 5-30 min under load and high-frequency ticks are regularly
# dropped (this repo's history: 1 scheduled tick out of ~16 expected). So the
# workflow does NOT need a tick every 5 minutes. Each tick starts ONE job that
# polls internally until the close (`python -m fpfssl scan`), and the
# `concurrency` group keeps a single scanner running: a tick that arrives while
# a session job is running simply becomes the next queued run and takes over
# when that job ends. Any single tick that fires near/inside the session now
# covers the whole session.
#
# Stopping it (all three were broken / missing before):
#   1. "Cancel workflow" in the Actions UI — the scanner installs its own
#      SIGINT/SIGTERM handlers, so it stops within a second, saves its dedup
#      state and exits. (It used to inherit SIGINT as SIG_IGN from the runner's
#      non-interactive shell, so cancel was silently swallowed for hours.)
#   2. It always ends on its own: at the close (15:30 IST + 15 min settle) or
#      at its `--max-runtime-minutes` budget — below the job's timeout, so the
#      runner never has to kill a pass.
#   3. Pause the schedule without touching this file: set the repository
#      variable SCANNER_ENABLED=false (Settings → Secrets and variables →
#      Actions → Variables). Scheduled ticks then exit immediately; manual
#      `workflow_dispatch` runs still work.
# ---------------------------------------------------------------------------
on:
  push:
    paths:
      - '.github/workflows/scanner.yml'
      - 'fpfssl/**'
      - 'config.yaml'
  schedule:
    # Every 10 min from 03:00 to 10:50 UTC (= 08:30-16:20 IST).
    - cron: '*/10 3-10 * * 1-5'
  repository_dispatch:
    types: [scan]          # external scheduler hook (cron-job.org etc.)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print alerts instead of sending them to Telegram
        type: boolean
        default: false
      once:
        description: Single scan pass (default = poll until the market close)
        type: boolean
        default: false
      symbols:
        description: Comma-separated tickers (blank uses config.yaml)
        type: string
        default: ''
      interval:
        description: Timeframe — 1m,5m,15m,30m,1h,1d (blank uses config.yaml)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # one live scanner at a time; queued ticks back each other up
  group: scanner-session
  cancel-in-progress: false

jobs:
  scan:
    # SCANNER_ENABLED=false pauses the 10-minute schedule (see header) without
    # deleting the cron or blocking a manual dispatch.
    if: github.event_name != 'schedule' || vars.SCANNER_ENABLED != 'false'
    runs-on: ubuntu-latest
    # hard cap below GitHub's 6h job limit: the poller exits at the close, and
    # a queued tick takes over if this job is cut off near the end of the day
    timeout-minutes: 350
    env:
      # Push runs are offline smoke tests; scheduled/dispatched runs are real.
      DRY_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
      ONCE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.once) }}
      SYMBOLS: ${{ inputs.symbols }}
      INTERVAL: ${{ inputs.interval }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Engine + live-path tests
        run: |
          python tests/test_engine.py
          python tests/test_fidelity_live.py
          python tests/test_live_scanner.py
          python tests/test_tap_filters.py
          python tests/test_essl_touch_alerts.py

      - name: Restore alert deduplication state
        if: env.DRY_RUN != 'true'
        uses: actions/cache/restore@v4
        with:
          path: state/scanner_state.json
          key: scanner-state-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scanner-state-main-

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          args=(scan)
          if [[ "$ONCE" == "true" ]]; then
            args+=(--once)
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          elif [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo '::error::Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets (or run with dry_run).'
            exit 1
          else
            args+=(--no-dry-run)   # config.yaml telegram.dry_run cannot silence CI
            # Wall-clock budget: the poller saves its dedup state and exits on
            # its own well before the job's timeout-minutes, so the runner
            # never has to kill a half-finished pass. The next queued tick
            # (cron fires every 10 min) picks the session back up.
            args+=(--max-runtime-minutes 325)
          fi
          if [[ "${{ github.event_name }}" == "push" ]]; then
            args+=(--source synthetic --symbols RELIANCE.NS --interval 15m)
          else
            if [[ -n "$SYMBOLS" ]]; then
              args+=(--symbols "$SYMBOLS")
            fi
            if [[ -n "$INTERVAL" ]]; then
              args+=(--interval "$INTERVAL")
            fi
          fi
          # Hard backstop under `timeout-minutes`: if the poller ever cannot
          # exit by itself, SIGTERM (handled: saves state, exits) and then
          # SIGKILL 5 minutes later. Nothing can run forever.
          timeout --signal=TERM --kill-after=5m 335m python -m fpfssl "${args[@]}"

      - name: Why (no) alert? — live state per symbol
        # `always()` but NOT after a cancel: this step re-fetches the whole
        # universe, and nobody wants a cancelled job to keep the runner busy
        # for another full-universe pass.
        if: always() && !cancelled()
        shell: bash
        run: |
          {
            echo "## Scanner diagnostics"
            echo ''
            echo '```text'
            # same feed/clock the scan used; --live marks the forming bar
            args=(diagnose)
            if [[ "${{ github.event_name }}" == "push" ]]; then
              args+=(--source synthetic --symbols RELIANCE.NS --interval 15m)
            else
              if [[ -n "$SYMBOLS" ]]; then
                args+=(--symbols "$SYMBOLS")
              fi
              if [[ -n "$INTERVAL" ]]; then
                args+=(--interval "$INTERVAL")
              fi
            fi
            python -m fpfssl "${args[@]}" 2>&1 | tail -n +2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Save alert deduplication state
        if: always() && env.DRY_RUN != 'true'
        uses: actions/cache/save@v4
        with:
          path: state/scanner_state.json
          key: scanner-state-main-${{ github.run_id }}-${{ github.run_attempt }}
