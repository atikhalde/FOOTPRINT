name: Scanner

on:
  push:
    paths:
      - '.github/workflows/scanner.yml'
  schedule:
    # Live NSE session 09:15-15:30 IST == 03:45-10:00 UTC, Mon-Fri.
    # Every 5 minutes across that window (GitHub may delay scheduled runs).
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print alerts without sending Telegram messages
        type: boolean
        default: true
      symbols:
        description: Comma-separated tickers (blank uses config.yaml)
        type: string
        default: ''
      interval:
        description: Timeframe — 1m,5m,15m,30m,1h,1d (blank uses config.yaml)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: scanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      # Push runs are offline smoke tests; scheduled runs send real alerts.
      DRY_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
      SYMBOLS: ${{ inputs.symbols }}
      INTERVAL: ${{ inputs.interval }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Engine tests (indicator parity + live path)
        run: |
          python tests/test_engine.py
          python tests/test_fidelity_live.py
      - name: Restore alert deduplication state
        if: env.DRY_RUN != 'true'
        uses: actions/cache/restore@v4
        with:
          path: state/scanner_state.json
          key: scanner-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scanner-state-${{ github.ref_name }}-
      - name: Scan once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          args=(scan --once)
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          elif [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo '::error::Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets.'
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "push" ]]; then
            args+=(--source synthetic --symbols RELIANCE.NS)
          else
            if [[ -n "$SYMBOLS" ]]; then
              args+=(--symbols "$SYMBOLS")
            fi
            if [[ -n "$INTERVAL" ]]; then
              args+=(--interval "$INTERVAL")
            fi
          fi
          python -m fpfssl "${args[@]}"
      - name: Save alert deduplication state
        if: always() && env.DRY_RUN != 'true'
        uses: actions/cache/save@v4
        with:
          path: state/scanner_state.json
          key: scanner-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
